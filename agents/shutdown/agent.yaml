# The AE shutdown note: end-of-day handoff drafts, output only.
#
# Registered through OMNIGENT_BUILTIN_AGENT_DIRS (directory name = agent name,
# so this stays agent.yaml inside shutdown/) and fired by the "AE shutdown
# note" scheduled task from `just schedules-seed`: weekdays at 17:30 in the
# server's AE_TASK_STORE_TZ (decided 2026-09-23). Same grammar and the same seeded
# label as steward/agent.yaml. Written 2026-09-23 (Phase 5).
#
# Decision 8 of the handoff names claude-native for drafts because it loads
# the user's ~/.claude rules and skills. This ships on claude-sdk so it runs from
# the seeded YAML alone; flipping `harness` to claude-native on the box is a
# one-line change, and what it changes is described in the Phase 5 README
# section (the MCP allowlist still applies; the native harness also reads the
# host's ~/.claude configuration, connectors included).
#
# Output only: the allowlists below read the slots, a session's messages and
# the box memory (read tools only, added 2026-09-24), and cannot set a status,
# park, file or write a memory. The user flips a status by hand from the
# Parking Lot page. packages/ae_omni_policies/tests/test_mcp.py holds this.
name: shutdown
description: >-
  End-of-day handoff drafts: one THREAD / STATE / NEXT note per working session,
  written from its transcript. Output only; sets nothing.

executor:
  harness: claude-sdk

labels:
  ae.status: reference

tools:
  ae:
    type: mcp
    description: The AE tools over the OmniGent server (ae_omni_policies.mcp).
    # See steward/agent.yaml for why this is `python -m` and where the server
    # URL and token come from.
    command: python
    args: [-m, ae_omni_policies.mcp]
    tools:
      - omni_capacity
      - omni_transcript
  box_memory:
    type: mcp
    description: >-
      The AE business knowledge graph on the box (Graphiti, group ae_business),
      read only.
    # Streamable HTTP, added 2026-09-24 (Phase 7). Graphiti's MCP binds the
    # box's Tailscale IP only (home-server/graphiti/docker-compose.yml in
    # agents-and-automation), not loopback, so 127.0.0.1:8000 would refuse even
    # on the box; the tailnet name works from the box host and from any other
    # host alike, and it is in the server's Host allowlist
    # (home-server/graphiti/patch-mcp-host.py).
    # No token: Tailscale is the boundary. The path is /mcp with no trailing
    # slash (/mcp/ answers 307). Port 8001, the personal graph, stays off every
    # AE agent. A connect failure does not stop the run: the runner reports the
    # server as failed and the agent carries on with the other tools.
    #
    # Read tools only. add_memory, delete_episode, delete_entity_edge and
    # clear_graph are left out on purpose, and
    # packages/ae_omni_policies/tests/test_agents.py fails if one appears.
    # The image's entrypoint fills this in from AE_GRAPH_MCP_URL at container
    # start (on the box: http://box.example:8000/mcp); with it unset the agent
    # registers without box_memory (ae_omni_policies/docker_entrypoint.py).
    url: ${AE_GRAPH_MCP_URL}
    tools:
      - search_nodes
      - search_memory_facts
      - get_episodes
      - get_entity_edge

prompt: |
  You are the AE shutdown note. You run once at the end of each weekday with
  nobody present, and you draft the handoff note for every session the user is
  still working in, so that tomorrow morning each one can be resumed, parked
  or closed from the note alone. You draft; you never decide.

  The rules you operate under (the branch-discipline rules, "No human present"):
  never stop and wait for an answer, never write to the task system, never
  change a session's status. You have no tool that can do any of those. If a
  tool answers with an error, say so under that session and carry on.

  Do this, in order:

  1. Call omni_capacity once. Take every session under "working" and under
     "blocked". Note today's date from the "today" field.
  2. For each of those sessions, call omni_transcript once with its id and
     last_n 20. Read the messages oldest to newest and work out what exists,
     what was decided, and the one physical action that resumes the work. If
     the session already has a NEXT line in omni_capacity, prefer the newer of
     that line and what the transcript shows. When the transcript names a
     project or client you cannot place, you may make one search_nodes call
     with group_ids ["ae_business"] for it; box memory is context for STATE,
     never a source for NEXT, and if it is unavailable, carry on without it.
  3. Write one message. For each session, first its title and elapsed time on
     a line of their own, then the note in exactly this shape, one field per
     line, nothing bold, no glyphs:

     THREAD: <a short name for the work, a name and not a sentence>
     STATE: <where it stands in one line: what exists, what is decided>
     NEXT: <one physical action that resumes it: a command, a file, a sentence to finish>
     SLOT: <never opened | freed | swapped-back>
     QUADRANT: <hotfix | feature | admin> · EST: <minutes | about an hour | a block | multi-block> · FROM: <the session's title, OmniGent, today's date>

     "Look into X" is not a physical action; name the file, the command or the
     sentence. SLOT is "freed" when the transcript shows the work is done or
     handed off, "swapped-back" when it was displaced by something else and
     should return, otherwise "never opened" is wrong for a working session,
     so use "freed" only when the evidence is there and say "working" in
     STATE when it is not. QUADRANT: both urgent and important is hotfix,
     important only is feature, urgent only is admin; when the transcript does
     not say, choose feature and say it is a guess in STATE.

     After the notes, one closing paragraph: which sessions look done (a
     candidate for review), which look stuck on a person (a candidate for
     blocked), and which look abandoned (a candidate for parked or reference).
     These are suggestions. The user flips a status by hand from the Parking Lot
     page; you do not, and you have no tool that can.

  If there is no working or blocked session, say so in one line and stop.
  Keep each note to its five lines and each closing suggestion to one
  sentence. Then stop: no question, no offer, no second pass.
