# The AE steward: the weekday-morning brief, propose-only.
#
# Registered as a built-in through OMNIGENT_BUILTIN_AGENT_DIRS (the directory
# name is the agent name, so this file must stay agent.yaml inside steward/)
# and fired by the "AE steward" scheduled task that `just schedules-seed`
# creates: weekdays at 08:00 America/Los_Angeles (decided 2026-09-23). The
# single-file grammar is upstream's docs/AGENT_YAML_SPEC.md; the seeded label
# is the single-file form of guardrails.labels (a top-level `labels:` map,
# omnigent/spec/omnigent.py `_translate_labels_yaml`), which the policy engine
# writes before the first prompt so the slot cap sees a placed session and
# abstains (docs/LABELS.md, "Placed sessions"). Written 2026-09-23 (Phase 5).
#
# Propose-only is structural, not a request: the MCP allowlists below expose
# two read-only AE tools and the box memory's read tools, and nothing that
# writes (no park_fork, no link_issue, no omni_set_status, no add_memory).
# packages/ae_omni_policies/tests/test_mcp.py and test_agents.py fail if that
# changes.
name: steward
description: >-
  Weekday-morning brief over the Parking Lot and the slots. Reads, reports
  once, never files, never asks.

executor:
  # claude-sdk runs on whatever Claude provider the host is set up with (Reid's
  # Max OAuth on the box). No model is pinned, so the provider's default applies.
  harness: claude-sdk

# The status the session starts with. A scheduled run is not a slot (a slot is
# a session a person is in), so it opts out by arriving already placed.
labels:
  ae.status: reference

tools:
  ae:
    type: mcp
    description: The AE tools over the OmniGent server (ae_omni_policies.mcp).
    # The host's Python must have the omnigent-ae-policies package installed
    # (`pip install packages/ae_omni_policies` into the environment `omnigent
    # host` runs from). `uv run` is not used because the host has no project
    # directory for it to resolve. No `env:` on purpose: the host then starts
    # it with the MCP SDK's default environment (HOME, PATH, USER and little
    # else), and a `${OMNIGENT_SERVER_URL}` here would fail spec loading
    # wherever that variable is unset. The server URL and token come from what
    # `omnigent login` wrote under ~/.omnigent/ (ae_omni_policies/omni.py).
    command: python
    args: [-m, ae_omni_policies.mcp]
    tools:
      - list_parked
      - omni_capacity
  box_memory:
    type: mcp
    description: >-
      The AE business knowledge graph on the box (Graphiti, group ae_business),
      read only.
    # Streamable HTTP, added 2026-09-24 (Phase 7). Graphiti's MCP binds the
    # box's Tailscale IP only (home-server/graphiti/docker-compose.yml in
    # agents-and-automation), not loopback, so 127.0.0.1:8000 would refuse even
    # on the box; the tailnet name works from the box host and from any other
    # host alike, and it is in the server's Host allowlist
    # (home-server/graphiti/patch-mcp-host.py).
    # No token: Tailscale is the boundary. The path is /mcp with no trailing
    # slash (/mcp/ answers 307). Port 8001, the personal graph, stays off every
    # AE agent. A connect failure does not stop the run: the runner reports the
    # server as failed and the agent carries on with the other tools.
    #
    # Read tools only. add_memory, delete_episode, delete_entity_edge and
    # clear_graph are left out on purpose, and
    # packages/ae_omni_policies/tests/test_agents.py fails if one appears.
    # The image's entrypoint fills this in from AE_GRAPH_MCP_URL at container
    # start (on the box: http://ae-llm-box:8000/mcp); with it unset the agent
    # registers without box_memory (ae_omni_policies/docker_entrypoint.py).
    url: ${AE_GRAPH_MCP_URL}
    tools:
      - search_nodes
      - search_memory_facts
      - get_episodes
      - get_entity_edge

prompt: |
  You are the AE steward. You run once on weekday mornings with nobody present,
  and you write one report about where Reid's work stands. You propose; you
  never act.

  The rules you operate under (the branch-discipline rules, "No human present"):
  never stop and wait for an answer, and never write to the task system. You
  have no tool that can write, and you would not use one if you had it. If a
  tool answers with an error, say so in the report and carry on with what you
  do have.

  Do this, in order:

  1. Call omni_capacity once. Note today's date in the "today" field and the
     timezone, and the slot limit in the "limit" field. Note every session
     under "working" and "blocked" with its title, elapsed time, NEXT line and
     whether a gate is open.
  2. Call list_parked once with status "open" and limit 100. A task resurfaces
     today when its "resurfaces" date is on or before today's date from step 1.
     A task with no resurface date never resurfaces on its own; leave it out of
     the resurfacing list but count it.
  3. Write the report as one message in this shape, plain text, no emoji, no
     headings deeper than these three lines:

     Steward brief for <today>

     Slots: <n> of <limit> working. Then one line per working session: the title,
     the elapsed time, and its NEXT line if it has one. Then one line per
     blocked session the same way, marked as waiting on a person. If a session
     has an open gate, say so on its line and name the fork clause.

     Resurfacing today: one line per task: the title, its quadrant, its size,
     its NEXT line, and the task URL exactly as the tool returned it. If none,
     say "Nothing resurfaces today" and give the count of parked tasks and the
     date of the next one.

     Suggested next pull: the one resurfacing task, or the oldest parked task
     when nothing resurfaces, with a sentence on why. You may make one
     search_memory_facts call with group_ids ["ae_business"] and that task's
     title as the query; when it returns a fact that bears on the task, add it
     in one line. If box memory is unavailable, say so in one line. This is
     a suggestion for Reid to accept or ignore from the Parking Lot page;
     you do not open it.

  Keep the whole report under forty lines. Every URL comes from a tool result,
  never composed. Use the vocabulary as the tools return it (working, blocked,
  review, parked, reference; hotfix, feature, admin). Close with one line that
  names what Reid does next: open the Parking Lot page and decide.

  Then stop. Do not call omni_capacity, list_parked or box memory a second
  time, do not ask a question, and do not offer to do anything.
