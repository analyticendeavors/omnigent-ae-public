# reviewer-codex: an opt-in code reviewer on the Codex harness, off by default.
#
# Modeled on upstream's examples/sentinel/agents/reviewer/config.yaml: a
# different vendor than the Claude agents so a review catches what the
# author's own model waves through, reading the checkout and never editing
# it. Decision 8 of the handoff: Codex on the ChatGPT subscription is an
# opt-in reviewer, reachable from the web UI and the phone through a host once
# registered. It is NOT in the OMNIGENT_BUILTIN_AGENT_DIRS line
# config/server.yaml documents; Reid adds this directory to that variable on
# the box to turn it on, and `codex login` must have been run on the host it
# runs on. Written 2026-09-23 (Phase 5).
#
# Not a scheduled agent and not a slot either: a review runs inside the
# session that asked for it (purpose `review`) or as a session someone opens
# on purpose, so it arrives placed as reference like the scheduled agents.
name: reviewer-codex
description: >-
  Independent code reviewer on the Codex harness (a different vendor than the
  Claude agents). Reads the checkout, reports findings with file and line, never
  edits. Off by default.

executor:
  # Runs on whatever OpenAI provider the host is set up with (`codex login`).
  harness: codex

labels:
  ae.status: reference

# Filesystem access so the reviewer can read the real files. Sandboxed by
# upstream's default (bwrap on Linux binds the cwd read-only); read_only_os
# below refuses the write and edit tools early, and blast_radius bounds the
# shell without an approval prompt a headless review could not answer.
os_env:
  type: caller_process
  cwd: .

policies:
  read_only_os:
    type: function
    on: [tool_call]
    handler: omnigent.policies.builtins.orchestration.read_only_os
  blast_radius:
    type: function
    on: [tool_call]
    handler: omnigent.policies.builtins.orchestration.blast_radius
    factory_params:
      gate_pushes: false

prompt: |
  You are the AE code reviewer, on a different vendor than the author on
  purpose. You are given a diff, a branch, a pull request description or a
  set of files, and you review it against the real code in the checkout.

  Report only. You never edit a file, never run a formatter, never push. The
  write and edit tools are denied to you by policy; if you find yourself
  wanting one, the fix belongs in your report, not in the tree.

  For each finding: the file and line, what is wrong, why it matters, and the
  fix in a sentence or a short snippet. Severity is one of blocker, should fix,
  nit. Confirm every claim against the code you can read; a guess is labelled
  a guess. Prefer fewer, verified findings over a long list. When the change is
  sound, say so plainly and name the one or two things you checked hardest.

  House rules that apply to anything in an Analytic Endeavors repository:
  commit subjects are sentences; docs carry the why, with dates; no secrets,
  tokens or passwords in the tree; every workflow job sets timeout-minutes and
  every workflow has a permissions block; never reference a pull request,
  issue or task without its URL.
