# omnigent-ae-policies: the AE branch-discipline layer that OmniGent loads out of
# tree through its own seams (policy_modules, debug_router_modules). Installed
# editable into upstream's venv by `just setup`; the image installs it in stage 2.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-ae-policies"
dynamic = ["version"]
description = "Analytic Endeavors' branch-discipline layer for OmniGent: slot cap, hurry modes, the gate observer, the fork classifier, Parking Lot routes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# The omnigent pin moves with the submodule (docs/UPSTREAM-SYNC.md, step 4).
# `mcp` is the stdio MCP server's SDK (ae_omni_policies.mcp, Phase 5, 2026-09-23);
# the range is upstream's own pin for the same package, so `uv sync` never has
# to choose between the two. `cryptography` (2026-10-20) encrypts the shared Claude
# accounts' tokens at rest (shared_accounts.py); upstream already locks it.
dependencies = [
    "omnigent>=0.18,<0.20",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "cryptography>=42",
]

[tool.setuptools.dynamic]
version = {attr = "ae_omni_policies.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Ruff: the same rule set as upstream/pyproject.toml so `just lint` holds the
# package to the tree it plugs into. target-version is py312 here (new code,
# no migration backlog); upstream keeps py310 for its own reasons.
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ARG", "BLE", "B", "SIM", "RET", "C4", "PIE", "DTZ", "LOG", "RUF"]
ignore = ["ARG003", "RUF001", "RUF002", "RUF003", "SIM102", "SIM103", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["ae_omni_policies"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG004", "ARG005", "BLE001", "RUF012", "B007", "B008", "SIM117"]

# Pytest runs from upstream/ (`just test`), so the suite can reuse upstream's
# server fixtures (tests/conftest.py, tests/server/conftest.py) through
# pytest_plugins in tests/conftest.py. pythonpath makes `tests.server...`
# importable from here; src/ keeps the package importable without an install.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../../upstream", "src"]
timeout = 300
timeout_method = "thread"
