# omnigent-ae-extension: the Parking Lot page as an OmniGent V1 browser extension.
# Registered through the `omnigent.extensions` entry point; the built bundle in
# src/ae_omni_extension/dist is committed so the package installs without Node
# (`just ext-build` rebuilds it and fails on drift). Installed editable into
# upstream's venv by `just setup`; the image installs it in stage 2.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-ae-extension"
# Static on purpose: upstream's conformance check reads project.version from
# this file and compares it with the manifest (plugin.py) and the installed
# distribution. Bump all three together.
version = "0.4.3"
description = "Analytic Endeavors' Parking Lot page for OmniGent: slots, open gates, the lot over task-store."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# The omnigent pin moves with the submodule (docs/UPSTREAM-SYNC.md, step 4),
# together with requires_omnigent in plugin.py.
dependencies = ["omnigent>=0.18,<0.20"]

[project.entry-points."omnigent.extensions"]
parking-lot = "ae_omni_extension.plugin:get_manifest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ae_omni_extension = ["dist/extension.js", "dist/extension.css"]

# Ruff: the same rule set as upstream/pyproject.toml and ae_omni_policies, so
# `just lint` holds every AE package to the tree it plugs into.
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ARG", "BLE", "B", "SIM", "RET", "C4", "PIE", "DTZ", "LOG", "RUF"]
ignore = ["ARG003", "RUF001", "RUF002", "RUF003", "SIM102", "SIM103", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["ae_omni_extension"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG004", "ARG005", "BLE001", "RUF012", "B007", "B008", "SIM117"]

# Runs from upstream/ (`just test`) like the policies suite, so upstream's
# `omnigent` import resolves from its venv; no server fixtures are needed here.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../../upstream", "src"]
timeout = 120
timeout_method = "thread"
