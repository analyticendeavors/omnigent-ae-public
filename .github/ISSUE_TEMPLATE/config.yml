# The issue chooser (2026-10-22): the two templates beside this file, plus the
# links below. No blank issues, so a security report cannot land in public by
# accident.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/analyticendeavors/omnigent-ae-public/security/advisories/new
    about: Privately, through a GitHub security advisory. Never in a public issue.
  - name: A problem in Omnigent itself
    url: https://github.com/omnigent-ai/omnigent/issues
    about: Bugs outside this fork's patches and packages belong with the upstream project.
