# ============================================================
# OpenSSF Scorecard (2026-10-22)
#
# Scores the repository's supply-chain practices (pinned actions, branch
# rules, token permissions, code review, Dependabot and the rest) and
# publishes the result for the README badge. The score is public, so the
# analysis runs only where the repository is public: the first job reads the
# visibility, which a scheduled run's event payload does not carry. The
# analysis job keeps to what Scorecard's publishing check allows (approved
# actions only, no run steps, no job env).
# ============================================================

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Mondays 06:27 UTC (Sunday 23:27 Pacific).
    - cron: "27 6 * * 1"
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visibility:
    name: Read whether the repository is public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.read.outputs.public }}
    steps:
      - name: Read the visibility
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/$GH_REPO" --jq .private)"
          if [ "$private" = "false" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "private repository: no Scorecard run" >> "$GITHUB_STEP_SUMMARY"
          fi

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
