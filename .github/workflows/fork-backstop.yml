# ============================================================
# Backstop for the public fork (2026-10-28)
#
# Every patch PR pushes its commits to the public fork analyticendeavors/omnigent as a topic
# branch before any check on this repository runs, and the pre-push hook is skipped by
# `git push --no-verify`, by a clone that never ran `just hooks-install`, and by a push made
# through the GitHub API. This hourly job fetches the fork's branches and scans every commit
# that is new since the last clean run with the private denylist. A hit fails the job and
# names the branch to delete; a first run, or one with no saved state, scans every branch.
# Values the fork already carried on 2026-10-29 are listed by class and hash in
# scripts/leak-fork-baseline.txt and are counted, not failed; only a new value fails. The
# saved state (branch and tip pairs) is now a speed-up: it advances only after a run with no
# new hit, and losing it costs one full rescan (about 190 s against 900 s with no baseline).
# docs/LEAK-SCAN.md
# ============================================================

name: Fork backstop

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17, UTC, so the local time on the box does not matter
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-backstop
  cancel-in-progress: false

jobs:
  scan:
    name: The public fork's branches carry no internal identifiers
    if: github.repository_id == 1366749882
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the last clean tips
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fork-backstop-state
          key: fork-backstop-${{ hashFiles('scripts/leak-fork-baseline.txt') }}-${{ github.run_id }}
          restore-keys: fork-backstop-${{ hashFiles('scripts/leak-fork-baseline.txt') }}-
      - name: Scan the fork's branches
        env:
          DENYLIST_B64: ${{ secrets.AE_LEAK_DENYLIST_B64 }}
          DENYLIST_SHA256: ${{ vars.AE_LEAK_DENYLIST_SHA256 }}
          # The first run scans every fork branch from the upstream base, which ran past the
          # scanner's default 120 s on 2026-10-29; later runs scan only new commits.
          AE_LEAK_SCAN_SECONDS: "900"
        run: |
          set -euo pipefail
          fork="$(sed -n 's/^AE_FORK=//p' upstream.lock)"
          upstream="$(sed -n 's/^UPSTREAM_REPO=//p' upstream.lock)"
          base="$(sed -n 's/^UPSTREAM_SHA=//p' upstream.lock)"
          workspace="$PWD"
          upstream_owner="$(printf '%s' "$upstream" | sed -E 's#^(https://|git@)github\.com[/:]##' | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$upstream" ] || [ "$upstream" = "$fork" ] || [ "$upstream_owner" = "analyticendeavors" ]; then
            echo "::error::UPSTREAM_REPO in upstream.lock is empty, equals AE_FORK, or belongs to analyticendeavors, so it is not upstream and would exclude our own history from the scan. Set it to the upstream project's repository (upstream.lock is generated by just sync-upstream)."
            exit 1
          fi
          mkdir -p fork-backstop-state
          git init --quiet "$RUNNER_TEMP/fork"
          cd "$RUNNER_TEMP/fork"
          git fetch --no-tags --quiet "$fork" '+refs/heads/*:refs/remotes/fork/*'
          # The fork also holds copies of upstream's own branches. Everything reachable from
          # upstream's heads and tags is public upstream code, not ours, and is left out of
          # every branch's range (2026-10-29: it was about nine tenths of the commits).
          git fetch --no-tags --quiet "$upstream" \
            '+refs/heads/*:refs/remotes/upstream/*' '+refs/tags/*:refs/remotes/upstream-tags/*'
          if [ -z "$(git for-each-ref --count=1 refs/remotes/upstream/)" ]; then
            echo "::error::Fetching UPSTREAM_REPO from upstream.lock produced no branches, so upstream's history cannot be left out of the scan. Check that UPSTREAM_REPO names a reachable repository."
            exit 1
          fi
          # A missing denylist secret fails the run (2026-10-29; it warned until the secret was set).
          python3 "$workspace/scripts/leak-scan.py" \
            --allowlist "$workspace/scripts/leak-allowlist.txt" \
            --denylist-b64-env DENYLIST_B64 --denylist-sha256-env DENYLIST_SHA256 \
            --denylist-missing fail \
            fork --base "$base" --state "$workspace/fork-backstop-state/tips.txt" \
            --baseline "$workspace/scripts/leak-fork-baseline.txt" \
            --exclude-refs refs/remotes/upstream/ --exclude-refs refs/remotes/upstream-tags/
