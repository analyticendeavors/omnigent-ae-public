# ============================================================
# omnigent-ae image publishing (Phase 6, 2026-09-23)
#
# On a tag push `ae-vX.Y.Z.N`: build the two-stage image exactly as ci.yml's
# `image` job does (stage 1 upstream's Dockerfile on the patched submodule,
# stage 2 deploy/Dockerfile), run the same smoke checks, then push
# $AE_IMAGE:<tag> with the workflow's own GITHUB_TOKEN (packages: write). The
# box pulls that tag by name (config/server.env, AE_IMAGE and
# OMNIGENT_IMAGE_TAG; deploy/README.md "Upgrade").
#
# workflow_dispatch is the dry run: build and smoke, no push, on whatever ref
# is chosen; the image is tagged dry-run-<sha>. Its `push` input publishes
# only when the chosen ref is an `ae-v*` tag, so a branch build can never
# land in the registry under a name the box would pull.
#
# release.yml (2026-09-24) creates the ae-v* tag after green CI on main and
# then dispatches this workflow on it with push on: a tag pushed with
# GITHUB_TOKEN does not fire the tag trigger above, so that dispatch is how an
# automatic release publishes. A tag pushed by hand still fires it directly.
#
# The first push creates the GHCR package private. A box pulling a private
# package needs `docker login ghcr.io` with a read:packages token before its
# first pull (README, Secrets). AE's private package is never made public: its
# older tags were built before the identifier scrub (deploy/README.md, step 5).
#
# The repository variable AE_IMAGE (2026-10-21, https://github.com/analyticendeavors/omnigent-ae-public/issues/13)
# names the package and is the only publish gate: unset, every run builds and
# smokes but never logs in or pushes, so a fork or a fresh copy is quiet until
# its owner opts in. When set, scripts/check-image-name.sh requires
# ghcr.io/<this repository's owner, lower-cased>/<name>, the only registry the
# workflow token can write to; anything else fails the run before the build.
# AE's private repo sets ghcr.io/analyticendeavors/omnigent-ae.
# ============================================================

name: Image

on:
  push:
    tags: ["ae-v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (only honoured when the ref is an ae-v* tag); off is a dry run"
        type: boolean
        default: false

# The writes sit on the one job, not here (2026-10-22): packages for the
# push, id-token and attestations for the build provenance attestation pushed
# beside a public package's image (actions/attest-build-provenance).
permissions:
  contents: read

# One build per ref; a second push of the same tag waits rather than racing
# the first push to the registry.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

# The decide step writes IMAGE (AE_IMAGE once checked, else a local name for
# the dry run) and PUSH; every later step reads those two.
env:
  AE_IMAGE: ${{ vars.AE_IMAGE }}

jobs:
  image:
    name: Build, smoke and publish the two-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Read upstream.lock into the job environment
        run: |
          set -euo pipefail
          grep -E '^UPSTREAM_TAG=' upstream.lock >> "$GITHUB_ENV"

      # The ref and the input are read once, here, into env; every later step
      # works from IMAGE_TAG and PUSH and carries no expression in its body.
      - name: Decide the image tag and whether to push
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PUSH_INPUT: ${{ inputs.push }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image=omnigent-ae-local
          if [ -n "$AE_IMAGE" ]; then
            scripts/check-image-name.sh "$AE_IMAGE" "$OWNER"
            image="$AE_IMAGE"
          fi
          push=false
          case "$REF_TYPE:$REF_NAME" in
            tag:ae-v*)
              tag="$REF_NAME"
              if [ "$EVENT" = "push" ] || [ "$PUSH_INPUT" = "true" ]; then
                push=true
              fi
              ;;
            *)
              tag="dry-run-${SHA:0:12}"
              if [ "$PUSH_INPUT" = "true" ]; then
                echo "::warning::push was requested but the ref ($REF_TYPE $REF_NAME) is not an ae-v* tag; building without pushing. Tag a commit ae-vX.Y.Z.N to publish."
              fi
              ;;
          esac
          if [ "$push" = "true" ] && [ -z "$AE_IMAGE" ]; then
            echo "::notice::repository variable AE_IMAGE is not set, so nothing is pushed. Set it to ghcr.io/<owner>/<name> to publish."
            push=false
          fi
          {
            echo "IMAGE=$image"
            echo "IMAGE_TAG=$tag"
            echo "PUSH=$push"
          } >> "$GITHUB_ENV"
          echo "image: $image:$tag (push=$push)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same two steps as ci.yml's image job: stage 1 through buildx for the
      # layer cache, loaded into the daemon so stage 2 can FROM it.
      - name: Build stage 1 (upstream server image from the patched tree)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream
          file: upstream/deploy/docker/Dockerfile
          push: false
          load: true
          tags: omnigent-ae-base:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build stage 2 (AE layer)
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile --build-arg BASE=omnigent-ae-base:release -t "$IMAGE:$IMAGE_TAG" .

      - name: Image runs the pinned version, lists the Parking Lot extension and imports the AE packages
        run: |
          set -euo pipefail
          ref="$IMAGE:$IMAGE_TAG"
          want="omnigent ${UPSTREAM_TAG#v}"
          got="$(docker run --rm "$ref" omni --version)"
          echo "omni --version: $got"
          case "$got" in
            "$want"*) ;;
            *)
              echo "::error::expected '$want', got '$got'. The image is not built from the pinned tag; check upstream.lock and the submodule pointer."
              exit 1
              ;;
          esac
          ext="$(docker run --rm "$ref" omni extensions list)"
          echo "omni extensions list: $ext"
          case "$ext" in
            *analyticendeavors.parking-lot*) ;;
            *)
              echo "::error::expected the Parking Lot extension in the catalog, got: $ext. Check that deploy/Dockerfile installs packages/ae_omni_extension and that its manifest is accepted."
              exit 1
              ;;
          esac
          docker run --rm "$ref" omni extensions doctor analyticendeavors.parking-lot
          docker run --rm "$ref" python -c "import ae_omni_policies, ae_omni_extension, ae_omni_policies.mcp; print('ae_omni_policies', ae_omni_policies.__version__, 'ae_omni_extension', ae_omni_extension.__version__)"
          docker run --rm "$ref" test -f /opt/ae/agents/steward/agent.yaml
          docker run --rm "$ref" test -f /opt/ae/agents/shutdown/agent.yaml
          docker run --rm "$ref" test -f /opt/ae/agents/orchestrator/agent.yaml

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tag
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          echo "pushed $IMAGE:$IMAGE_TAG"
          # The registry's digest for this tag, not a local RepoDigests entry
          # that may name another repository.
          digest="$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo "## Published"
            echo
            echo '```'
            echo "$IMAGE:$IMAGE_TAG"
            echo '```'
            echo
            echo "On the box: set OMNIGENT_IMAGE_TAG=$IMAGE_TAG in config/server.env, then deploy/compose.sh pull && deploy/compose.sh up -d (deploy/README.md, Upgrade)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact attestations need a public repository on AE's plan, so a
      # private copy pushes without one. Anyone can then check a pulled tag:
      # gh attestation verify oci://<image>:<tag> -R <owner>/<repo>.
      - name: Attest the build provenance
        if: env.PUSH == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Dry run, not pushed
        if: env.PUSH != 'true'
        run: |
          set -euo pipefail
          echo "built and smoked $IMAGE:$IMAGE_TAG; nothing pushed (dry run)."
          echo "Dry run: built and smoked \`$IMAGE:$IMAGE_TAG\`, nothing pushed." >> "$GITHUB_STEP_SUMMARY"
