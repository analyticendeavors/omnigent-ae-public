# ============================================================
# omnigent-ae CI
#
# Eight jobs, each proving one thing about the thin fork:
#
#   patches         the committed patches/ match a fresh export from the
#                   submodule (no drift), and the series applies onto the
#                   pristine upstream tag and reproduces the fork branch tree
#   upstream-smoke  upstream's policy and extension suites pass inside our
#                   pinned tree (the seams the AE layer leans on), plus the
#                   item-observers suite patch P3 adds (Phase 4, 2026-09-23)
#   python          the AE packages lint clean and their suites pass against
#                   the pinned tree (added 2026-09-23 with Phase 1); the
#                   Parking Lot extension installs and `omni extensions doctor`
#                   resolves its bundle (Phase 3); tests/deploy holds the
#                   compose override, the systemd units, the scripts and
#                   image.yml to what a runner can check (Phase 6)
#   web             upstream's web workspace, with the patch series applied,
#                   passes its own lint and type-check (added 2026-09-23 with
#                   Phase 2, the first patch); the vitest suites the patches
#                   add or touch are green (one job again since 2026-11-01,
#                   after four shards cost more billed minutes than they
#                   saved); the Parking Lot page's committed bundle matches a
#                   fresh build (Phase 3)
#   image           the two-stage image builds; `omni --version` inside it
#                   prints the pinned version; the extension catalog lists the
#                   Parking Lot page with its bundle resolved; the AE packages
#                   import
#   rules           the branch-discipline block in CLAUDE.md is present,
#                   intact and identical to its source in ae-claude-skills;
#                   without the RULES_SOURCE_TOKEN secret it can only check
#                   the markers, so it warns and passes instead of failing
#                   (decided 2026-09-11: a required check that cannot pass
#                   until an unrelated manual step blocks every merge)
#
#   leaks           nothing internal rides along: on a push to main,
#                   scripts/leak-scan.py checks the pushed commits (each on its
#                   own, messages included) and then the whole tree for IPs,
#                   hosts, e-mail, home paths, cloud ids, private repository
#                   links and secrets, plus the private denylist when the
#                   repository secret AE_LEAK_DENYLIST_B64 exists (added
#                   2026-10-28; without the secret it warns and runs the
#                   generic classes only, and a later PR makes that a failure).
#                   A pull request is scanned by leak-pr.yml instead, so the
#                   scan re-runs when its approval label changes. docs/LEAK-SCAN.md
#
# Box routing (2026-11-01, off until the repository variable CI_BOX_RUNNER is "on"):
# the five jobs above except image and leaks can run on the owner's box, plus one
# job that exists only while routing is on ("Box watchdog"); the docker-marked
# tests run as extra steps of the image job. ci-box-fallback.yml reruns a lost run
# on GitHub. All of it is in deploy/ci-runner/README.md.
#
# Why an EMPTY patch series gets all of this (2026-09-11): upstream ships a
# minor release weekly, so the sync machinery has to be proven before the first
# patch exists. A sync that breaks it is then caught by the sync PR itself, not
# by some later feature PR that happens to touch the same file.
# ============================================================

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the test jobs run: auto follows the CI_BOX_RUNNER variable, box forces the box runners, hosted forces GitHub-hosted runners"
        type: choice
        options: [auto, box, hosted]
        default: auto

permissions:
  contents: read

# One run per PR at a time; a new push supersedes the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}
  cancel-in-progress: true

env:
  # upstream's setup.py builds the web SPA during `uv sync` unless told not to.
  # No job here serves the bundle; the image job builds it inside Docker.
  OMNIGENT_SKIP_WEB_UI: "true"

jobs:
  patches:
    name: Patch series matches and applies
    runs-on: &box_runs_on ${{ github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) && fromJSON('["self-hosted","ae-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install just
        uses: ./.github/actions/install-just
      - name: Read upstream.lock into the job environment
        run: |
          set -euo pipefail
          # Later steps read the pin from env, never from a workflow expression.
          grep -E '^(UPSTREAM_TAG|UPSTREAM_SHA|AE_BRANCH_SHA|PATCH_COUNT)=' upstream.lock >> "$GITHUB_ENV"

      - name: Lock, pointer and patches agree
        run: just lock-check

      # Runs on the checked-out pointer, before anything moves: the committed
      # .patch files must be exactly what `git format-patch` yields from it.
      - name: Committed patches match a fresh export
        run: just patches-check

      - name: Reset upstream/ to the pristine tag
        run: |
          set -euo pipefail
          # git am needs a committer identity. Which one is irrelevant: the
          # next step compares trees, not commit ids.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # By tag, else by sha: the tag commit is an ancestor of the fork
          # branch even when the tag itself never reached the fork
          # (scripts/_lib.sh, ensure_tag_commit).
          if ! git -C upstream cat-file -e "${UPSTREAM_SHA}^{commit}"; then
            git -C upstream fetch --depth=200 origin "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}" \
              || git -C upstream fetch --depth=200 origin "$UPSTREAM_SHA"
          fi
          git -C upstream checkout -q --detach "$UPSTREAM_SHA"

      - name: Series applies onto the tag
        run: just patches-apply

      - name: Applied tree equals the fork branch
        run: |
          set -euo pipefail
          if ! git -C upstream diff --quiet "$AE_BRANCH_SHA" HEAD; then
            echo "::error::applying patches/ onto ${UPSTREAM_TAG} does not reproduce the tree at ${AE_BRANCH_SHA}. Run 'just patches-export' and commit patches/, upstream.lock and the submodule pointer together."
            exit 1
          fi
          echo "patches/ reproduce ${AE_BRANCH_SHA} from ${UPSTREAM_TAG} (${PATCH_COUNT} patch(es))"

  upstream-smoke:
    name: Upstream policy and extension suites
    runs-on: *box_runs_on
    timeout-minutes: 30
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python (upstream's pin)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: upstream/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: upstream/uv.lock

      - name: Install just
        uses: ./.github/actions/install-just
      - name: Install upstream's locked test environment
        run: just setup

      - name: Run the policy and extension suites
        run: just upstream-smoke

  python:
    name: AE package lint and tests
    runs-on: *box_runs_on
    timeout-minutes: 30
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python (upstream's pin)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: upstream/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: upstream/uv.lock

      - name: Install just
        uses: ./.github/actions/install-just
      - name: Install upstream's locked test environment and the AE package
        run: just setup

      # tests/deploy (Phase 6, 2026-09-23) runs shellcheck over deploy/*.sh and
      # actionlint over the workflows, and skips each with a warning when the
      # tool is absent; here both must be present so the checks run. shellcheck
      # ships in the ubuntu-latest image (installed from apt only if not); the
      # actionlint binary comes from its PyPI wrapper, version-pinned. The webp
      # package gives test_leak_scan.py the real anim_dump, so its GIF and WebP
      # frame tests run against the binary instead of skipping.
      - name: Install shellcheck, webp and actionlint
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null && command -v cwebp >/dev/null; then
            echo "shellcheck and webp already installed"
          else
            if ! command -v shellcheck >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends shellcheck
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends webp
          fi
          shellcheck --version | head -2
          command -v anim_dump
          uv tool install --force actionlint-py==1.7.12.25
          bin_dir="$(uv tool dir --bin)"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/actionlint" --version

      - name: Lint the AE packages
        run: just lint

      # On a box runner the docker-backed deploy tests are deselected (the runner
      # user has no docker access, on purpose); steps of the image job run them on
      # a GitHub-hosted runner instead. DEPLOY_MARKER is empty on
      # GitHub-hosted runners, so the same step runs everything there.
      - name: Run the AE package suites
        env:
          DEPLOY_MARKER: ${{ github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) && 'not docker' || '' }}
        run: just test

      - name: The Parking Lot extension is installed and its bundle resolves
        run: just ext-doctor

  web:
    name: Web workspace lint, type-check, extension bundle
    runs-on: *box_runs_on
    timeout-minutes: 30
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # The version is upstream's `packageManager` field in upstream/package.json,
      # read by pnpm's own action, pinned by commit like every other action here,
      # in place of `npm install -g` (2026-10-22: Scorecard Pinned-Dependencies on
      # the public repo counts a global npm install as unpinned). It runs before
      # setup-node because `cache: pnpm` needs pnpm on the PATH.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: upstream/package.json

      - name: Set up Node (upstream's Dockerfile and CI pin node 22)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Install just
        uses: ./.github/actions/install-just
      - name: Lint and type-check
        run: just web-lint

      # The web-check vitest list, in this one job. It was four parallel shards
      # from 2026-10-20 to save wall-clock time, but each shard repeated the
      # checkout, node and pnpm install, which cost more billed minutes than the
      # time it saved. `just web-test` defaults to the whole list (shard 1/1).
      - name: The P1 and P2 vitest suites
        if: ${{ !cancelled() }}
        run: just web-test

      # The bundle in git must be what the source builds; a rebuild that
      # changes it means someone edited web/src without running `just ext-build`.
      - name: The Parking Lot page's committed bundle matches a fresh build
        if: ${{ !cancelled() }}
        run: just ext-build

  image:
    name: Two-stage image runs the pinned version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Read upstream.lock into the job environment
        run: |
          set -euo pipefail
          grep -E '^UPSTREAM_TAG=' upstream.lock >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Stage 1 is upstream's own Dockerfile on the patched tree (web bundle
      # included). Built through buildx for the GitHub Actions layer cache, then
      # loaded into the local daemon so stage 2 can FROM it.
      - name: Build stage 1 (upstream server image from the patched tree)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream
          file: upstream/deploy/docker/Dockerfile
          push: false
          load: true
          tags: omnigent-ae-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Plain `docker build`: the buildx container driver cannot see images in
      # the local daemon, and the base built above lives only there.
      - name: Build stage 2 (AE layer)
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile --build-arg BASE=omnigent-ae-base:ci -t omnigent-ae:ci .

      - name: Image runs the pinned version, lists the Parking Lot extension and imports the AE packages
        run: |
          set -euo pipefail
          want="omnigent ${UPSTREAM_TAG#v}"
          got="$(docker run --rm omnigent-ae:ci omni --version)"
          echo "omni --version: $got"
          case "$got" in
            "$want"*) ;;
            *)
              echo "::error::expected '$want', got '$got'. The image is not built from the pinned tag; check upstream.lock and the submodule pointer."
              exit 1
              ;;
          esac
          ext="$(docker run --rm omnigent-ae:ci omni extensions list)"
          echo "omni extensions list: $ext"
          case "$ext" in
            *analyticendeavors.parking-lot*) ;;
            *)
              echo "::error::expected the Parking Lot extension in the catalog, got: $ext. Check that deploy/Dockerfile installs packages/ae_omni_extension and that its manifest is accepted (omni extensions doctor analyticendeavors.parking-lot)."
              exit 1
              ;;
          esac
          docker run --rm omnigent-ae:ci omni extensions doctor analyticendeavors.parking-lot
          pkg="$(docker run --rm omnigent-ae:ci python -c "import ae_omni_policies; print(ae_omni_policies.__version__)")"
          echo "ae_omni_policies: $pkg"
          ext_pkg="$(docker run --rm omnigent-ae:ci python -c "import ae_omni_extension; print(ae_omni_extension.__version__)")"
          echo "ae_omni_extension: $ext_pkg"

      # Box routing only (see deploy/ci-runner/README.md): the python job deselects the
      # docker-marked tests on a box runner, so they run here, in a job the merge gate
      # already requires. With routing off these steps are skipped.
      - name: Set up Python for the docker-backed deploy tests
        if: ${{ !cancelled() && github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: upstream/.python-version

      - name: Set up uv for the docker-backed deploy tests
        if: ${{ !cancelled() && github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: upstream/uv.lock

      - name: Install just for the docker-backed deploy tests
        if: ${{ !cancelled() && github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
        uses: ./.github/actions/install-just
      - name: Install upstream's locked test environment for the docker-backed deploy tests
        if: ${{ !cancelled() && github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
        run: just setup

      - name: Docker-backed deploy tests (only the tests marked docker)
        if: ${{ !cancelled() && github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
        run: cd upstream && uv run --no-sync pytest ../tests/deploy -q -p no:cacheprovider -m docker

  rules:
    name: Branch-discipline block matches its source
    if: github.repository == 'analyticendeavors/omnigent-ae'
    runs-on: *box_runs_on
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the managed block against ae-claude-skills
        env:
          RULES_SOURCE_TOKEN: ${{ secrets.RULES_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RULES_SOURCE_TOKEN:-}" ]; then
            echo "::warning::RULES_SOURCE_TOKEN is not set, so the rules block was NOT compared with its source. Create a fine-grained PAT with Contents (read) on analyticendeavors/ae-claude-skills and add it to this repository as a secret named RULES_SOURCE_TOKEN. Until then this job only checks that the managed markers are present."
            start='<!-- AE-BRANCH-DISCIPLINE-RULES:START (managed by scripts/setup-branch-discipline-local.sh) -->'
            end='<!-- AE-BRANCH-DISCIPLINE-RULES:END -->'
            n_start="$(grep -cF "$start" CLAUDE.md || true)"
            n_end="$(grep -cF "$end" CLAUDE.md || true)"
            if [ "$n_start" -ne 1 ] || [ "$n_end" -ne 1 ]; then
              echo "::error::CLAUDE.md must carry exactly one START and one END marker of the managed rules block (found $n_start and $n_end). Re-stamp it with ae-claude-skills' scripts/setup-branch-discipline-local.sh --repo ."
              exit 1
            fi
            echo "managed markers present; source comparison skipped"
            exit 0
          fi
          src="$RUNNER_TEMP/ae-claude-skills"
          # The token rides in the clone URL; Actions masks registered secrets
          # in the log, so a clone failure still prints a readable reason.
          git clone -q --depth 1 "https://x-access-token:${RULES_SOURCE_TOKEN}@github.com/analyticendeavors/ae-claude-skills.git" "$src"
          "$src/scripts/setup-branch-discipline-local.sh" --repo "$GITHUB_WORKSPACE" --check

  leaks:
    # A pull request is scanned by leak-pr.yml (the job named "leaks", which a ruleset can
    # require and which re-runs when the approval label changes, 2026-10-28). This job keeps
    # the scan of what lands on main: the pushed commits, then the whole tree.
    name: No internal identifiers in the pushed commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for internal identifiers
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PRIVATE_REPO: ${{ github.repository_id == 1366749882 }}
          DENYLIST_B64: ${{ secrets.AE_LEAK_DENYLIST_B64 }}
          DENYLIST_SHA256: ${{ vars.AE_LEAK_DENYLIST_SHA256 }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PRIVATE_REPO" = "true" ]; then
            # A set secret with no hash variable, or a hash that differs, fails the job, and so
            # does a missing secret (2026-10-29: a warning let the generic classes pass a PR
            # in a clone with no denylist, and the secret is set now).
            args=(--denylist-b64-env DENYLIST_B64 --denylist-sha256-env DENYLIST_SHA256 --denylist-missing fail)
          fi
          # A direct push to main: its commit messages and every commit's lines, then the tree.
          # The allowlist is the pushed head's: its new entries passed the pull request's
          # approval, which the push of the merge cannot repeat. --no-identity (2026-10-29): a
          # merge commit's author is the merger's own GitHub address, which failed every merge
          # and stopped every release tag; main's history never goes public (the public mirror
          # is rebuilt under a fixed identity, and pushes to the fork check identity themselves).
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/leak-scan.py "${args[@]}" diff --allowlist-from head --no-identity \
              --base "$BEFORE_SHA" --head "$GITHUB_SHA"
          fi
          python3 scripts/leak-scan.py "${args[@]}" tree --ref HEAD

  # ---- box routing (off while the repository variable CI_BOX_RUNNER is not "on") ----
  # deploy/ci-runner/README.md holds the install, the kill switch and the drills.
  # This job carries the routing expression as its `if:`, so with routing off it is
  # skipped and bills nothing.
  #
  # A job queued for a runner that is not there waits 24 hours. This one watches the
  # five box-eligible jobs of THIS attempt. Every 30 s: if they are still queued and no
  # job anywhere in the repository is running on an ae-box-* runner (the box looks off),
  # it cancels the run once they have been queued 2 minutes. If the box is alive but busy
  # it keeps waiting, up to 30 minutes. If every listed box job started but fewer than
  # five exist after 2 minutes (GitHub left jobs out of the attempt), it cancels too.
  # ci-box-fallback.yml then reruns on GitHub.
  # An API error is retried and, if it persists, counts as "unknown" and is polled again;
  # unknown for 2 minutes cancels too. It never fails the job.
  box-watchdog:
    name: Box watchdog
    if: ${{ github.run_attempt == '1' && contains(format(',{0},', vars.CI_BOX_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.actor)) && (inputs.runner == 'box' || (vars.CI_BOX_RUNNER == 'on' && inputs.runner != 'hosted' && !startsWith(github.head_ref, 'dependabot/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Wait for the box jobs to start
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # Display names of the jobs that run on the box; keep in step with ci.yml.
          names='["Patch series matches and applies","Upstream policy and extension suites","AE package lint and tests","Web workspace lint, type-check, extension bundle","Branch-discipline block matches its source"]'
          api() { # gh api with 3 tries and backoff; prints the body, returns 1 if all fail
            local n out
            for n in 1 2 3; do
              if out="$(gh api "$@" 2>/dev/null)"; then printf '%s' "$out"; return 0; fi
              sleep $((n * 3))
            done
            return 1
          }
          start=$SECONDS
          last_ok=$SECONDS
          queued_since=""
          alive=0
          next_check=0
          while :; do
            if jobs_json="$(api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" --jq '.jobs[]' | jq -s .)" && [ -n "$jobs_json" ]; then
              last_ok=$SECONDS
              waiting="$(jq -r --argjson names "$names" '[.[] | select(.name as $n | $names | index($n)) | select(.status != "in_progress" and .status != "completed") | .name] | join("; ")' <<<"$jobs_json")"
              seen="$(jq -r --argjson names "$names" '[.[] | select(.name as $n | $names | index($n))] | length' <<<"$jobs_json")"
              if [ "$seen" -ge 5 ] && [ -z "$waiting" ]; then
                echo "all box jobs started"
                echo "stuck=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Every box job listed has started, but fewer than five are listed: GitHub left
              # jobs out of this attempt. On 2026-11-09 (run 42674421982, the merge of
              # https://github.com/analyticendeavors/omnigent-ae/pull/526) the patch series and
              # upstream suites jobs never appeared in 30 minutes while this loop waited out its
              # 30-minute cap. All jobs are created when the run starts, so after 2 minutes
              # cancel and let the fallback rerun the whole run, missing jobs included.
              if [ -z "$waiting" ] && [ "$seen" -lt 5 ] && [ $((SECONDS - start)) -ge 120 ]; then
                echo "::warning::only ${seen} of the 5 box jobs exist in this attempt after 2 minutes; GitHub left the others out, so cancelling for the fallback to rerun them"
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              [ -n "$queued_since" ] || queued_since=$SECONDS
              # Box alive? A box job of this run already running on an ae-box-* runner says yes.
              if jq -e '[.[] | select(.runner_name | type == "string" and startswith("ae-box-"))] | length > 0' >/dev/null <<<"$jobs_json"; then
                alive=1
              elif [ "$SECONDS" -ge "$next_check" ] && [ $((SECONDS - queued_since)) -ge 60 ]; then
                # One list of in-progress runs per check (at most 5 runs' jobs read), every 2.5 minutes.
                next_check=$((SECONDS + 150))
                alive=0
                if runs="$(api "repos/${REPO}/actions/runs?status=in_progress&per_page=20" --jq '[.workflow_runs[] | select(.name == "CI" and .id != '"${RUN_ID}"') | .id] | .[0:5] | .[]')"; then
                  for rid in $runs; do
                    if other="$(api "repos/${REPO}/actions/runs/${rid}/jobs?per_page=100" --jq '[.jobs[] | select(.status == "in_progress") | .runner_name] | map(select(. != null and startswith("ae-box-"))) | length')" && [ "${other:-0}" -gt 0 ]; then
                      alive=1
                      break
                    fi
                  done
                fi
              fi
              waited=$((SECONDS - queued_since))
              if [ "$alive" -eq 0 ] && [ "$waited" -ge 120 ]; then
                echo "::warning::box jobs queued for ${waited}s and no ae-box-* runner is running a job: the box looks off (${waiting})"
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$waited" -ge 1800 ]; then
                echo "::warning::box jobs still queued after 30 minutes although the box is busy (${waiting})"
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::notice::job status unknown (API error), polling again"
              if [ $((SECONDS - last_ok)) -ge 120 ]; then
                echo "::warning::job status unknown for 2 minutes; cancelling so the fallback can rerun on GitHub"
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ $((SECONDS - start)) -ge 2100 ]; then
              echo "stuck=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done

      - name: "Cancel: box jobs never started"
        if: ${{ steps.wait.outputs.stuck == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "The box runners did not pick up the test jobs in time. Cancelled this run; the fallback workflow reruns it once on GitHub-hosted runners." | tee -a "$GITHUB_STEP_SUMMARY"
          for n in 1 2 3; do
            if gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/cancel"; then exit 0; fi
            sleep $((n * 3))
          done
          echo "::error::Could not cancel this run after 3 tries. Cancel it by hand, or use Re-run all jobs: attempt 2 always runs on GitHub-hosted runners."
          exit 1
