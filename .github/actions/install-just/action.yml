# Install a pinned just from its release asset, checked by sha256 (2026-10-22).
# extractions/setup-just (v4.0.0, through extractions/setup-crate v2.0.0) listed
# casey/just's releases through the GitHub API and, again and again that day, found
# no Linux asset ("no release for just matching version specifier"), failing one to
# four CI jobs per run before any test ran. A fixed download URL and a checksum need
# no API call. Dependabot does not track this pin: to move to a newer just, take
# both values from that release's SHA256SUMS asset, and set the same two in
# .github/workflows/patch-rebase.yml (tests/deploy/test_patch_rebase.py checks).
name: Install just
description: Install the pinned just release on a Linux x86_64 runner and put it on PATH.
runs:
  using: composite
  steps:
    - name: Download, verify and install just
      shell: bash
      env:
        JUST_VERSION: "1.59.0"
        JUST_SHA256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS-$RUNNER_ARCH" != Linux-X64 ]; then
          echo "::error::install-just fetches the x86_64 Linux build of just; this runner is $RUNNER_OS-$RUNNER_ARCH. Add that platform's asset and sum to .github/actions/install-just."
          exit 1
        fi
        archive="$RUNNER_TEMP/just-${JUST_VERSION}.tar.gz"
        curl --fail --silent --show-error --location --max-time 60 --retry 3 --output "$archive" "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${JUST_SHA256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/just-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/just-bin" just
        echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/just-bin/just" --version
