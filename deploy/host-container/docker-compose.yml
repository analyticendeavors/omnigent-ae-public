# One user's OmniGent host as its own compose project on the box (2026-10-20,
# deploy/README.md "Second user's host (container)"). One project per user:
# deploy/host-container.sh <user> fills in AE_HOST_USER and the project name
# (omnigent-host-<user>) and runs `docker compose` on this file; nothing here
# changes per user except through that variable.
#
# What the user's agents can reach, and why:
#
# - the server, as http://omnigent:8000, over the network
#   omnigent-host-<user>. That network is declared (internal: true) in the
#   machine's config/compose.local.yml, which deploy/compose.sh layers on the
#   server stack and which joins the server container to it; this project only
#   attaches to it. Its other members are this user's
#   host and nothing else, so it reaches neither Postgres (which stays on the
#   server stack's default network) nor another user's host.
# - the internet, through the egress proxy only (squid.conf). The host sits on
#   internal networks alone, so it has no route to the box's loopback, its LAN
#   or tailnet addresses, the Docker bridges or the tailnet; the proxy refuses
#   private and tailnet destinations by resolved address.
#
# Nothing on the box is mounted: the user's home (logins for OmniGent, Claude,
# gh and az, and the workspaces) is the named volume omnigent-host-<user>-home.
# No docker socket, no /secure, nothing under the host user's home. The user inside is
# `agent` (uid 61000), with no-new-privileges and a memory, CPU and process cap
# so one user's runaway session cannot starve the box.

name: omnigent-host-${AE_HOST_USER:?run this through deploy/host-container.sh <user>}

services:
  host:
    image: omnigent-ae-host:${OMNIGENT_IMAGE_TAG:?set OMNIGENT_IMAGE_TAG in config/server.env}
    container_name: omnigent-host-${AE_HOST_USER}
    # The name the Hosts view shows for this host.
    hostname: omnigent-host-${AE_HOST_USER}
    init: true
    restart: unless-stopped
    depends_on:
      - egress
    environment:
      # The internal URL. `omnigent login` must be given this exact string:
      # the stored token is keyed by it, and the host is started with it.
      OMNIGENT_SERVER_URL: http://omnigent:8000
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      http_proxy: http://egress:3128
      NO_PROXY: omnigent,localhost,127.0.0.1,::1
      no_proxy: omnigent,localhost,127.0.0.1,::1
      # The host hands its runners only an allowlist of its environment, and
      # the proxy variables are not on it; without this line Claude Code, gh,
      # az, git and npm inside a session would have no way out at all.
      OMNIGENT_RUNNER_ENV_PASSTHROUGH: HTTPS_PROXY,HTTP_PROXY,NO_PROXY,https_proxy,http_proxy,no_proxy
    env_file:
      # Optional per-user settings and credentials (config/hosts/<user>.env,
      # gitignored; deploy/host-container/user.env.example lists what may go there).
      - path: ${AE_HOST_ENV_FILE:-/dev/null}
        required: false
    volumes:
      - home:/home/agent
    networks:
      - server
      - egress
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AE_HOST_MEM_LIMIT:-16g}
    cpus: ${AE_HOST_CPUS:-8}
    pids_limit: ${AE_HOST_PIDS_LIMIT:-4096}

  egress:
    image: omnigent-ae-host-egress:${OMNIGENT_IMAGE_TAG}
    container_name: omnigent-host-${AE_HOST_USER}-egress
    restart: unless-stopped
    networks:
      - egress
      - outbound
    # The Squid image declares both as volumes; tmpfs keeps every recreate from
    # leaving two anonymous volumes behind. Nothing is cached, and the image's
    # entrypoint tails the logs to stdout (docker logs).
    tmpfs:
      - /var/spool/squid:mode=1777
      - /var/log/squid:mode=1777
    mem_limit: 512m
    pids_limit: 256

networks:
  server:
    name: omnigent-host-${AE_HOST_USER}
    external: true
  egress:
    name: omnigent-host-${AE_HOST_USER}-egress
    internal: true
    # No address on the box's side of the bridge: an internal network still
    # gets a gateway address on the box, which the host could use to reach
    # anything the box serves on a wildcard address (ssh :22 answered).
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  outbound:
    name: omnigent-host-${AE_HOST_USER}-outbound

volumes:
  home:
    name: omnigent-host-${AE_HOST_USER}-home
