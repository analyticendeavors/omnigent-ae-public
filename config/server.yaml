# omnigent-ae server config (Phase 1, 2026-09-23; the classifier, the rabbit
# hole and the observer fallback added in Phase 4, 2026-09-23; the agents and
# the MCP server's environment documented in Phase 5, 2026-09-23).
#
# Local: `just dev` runs `omnigent server --config ../config/server.yaml` from
# upstream/. On the box the image carries a copy at /opt/ae/config/server.yaml
# and OMNIGENT_CONFIG points there (since 2026-09-24; before, at a hand-made
# copy in /data), so this file ships with each release tag. Keys verified against upstream v0.13.0 (the pin has moved since; see
# upstream.lock) (omnigent/cli.py
# reads admins, policy_modules, debug_router_modules, policies; the policies
# grammar is docs/POLICIES.md).
#
# No secrets here, ever. The task-store service token
# (AE_CF_ACCESS_CLIENT_ID / AE_CF_ACCESS_CLIENT_SECRET) and the accounts
# cookie secret come from the environment.

# Microsoft sign-in since 2026-10-14 (deploy/README.md, "Adding an OIDC provider"): the login
# identity is the lowercased Entra UPN, so the admin is named by it. The
# accounts-mode user was renamed to it in the database at the cutover. A login
# identity listed here is promoted to admin; a name that matches nobody is inert.
#
# This line ships a placeholder (2026-10-21). Name the real admin one of two ways:
# - the roster file /data/admins in the server's data volume (upstream's
#   omnigent/server/admin_list.py: one login per line, `#` comments, read again
#   whenever the file changes, no restart; OMNIGENT_ADMIN_LIST_PATH moves it), or
# - this line, for an operator who rebuilds the image from a fork (this file
#   ships in the image, so it is a commit and a tag), or in a copy of this file
#   that OMNIGENT_CONFIG points at.
# On the published image the roster file is the route: it needs no rebuild.
# The two are merged: a login in either is an admin. Promotion is additive, so
# removing a name never demotes anyone.
admins: [you@example.com]

# The AE layer, loaded through upstream's own seams: the module exporting
# POLICY_REGISTRY, and the module exporting DEBUG_ROUTERS (the /v1/ae routes).
# Importing the package also registers the observer with patch P3's
# item-observers registry (Phase 4, 2026-09-23).
policy_modules: [ae_omni_policies]
debug_router_modules: [ae_omni_policies.router]

# The policy model, optional (Phase 4, 2026-09-23). Only the fork-suspect
# classifier uses it, through event["llm_client"], and it abstains when this
# block is absent: the fork runs without any model box. Uncomment one of the
# two examples to turn the classifier on. The grammar is upstream's
# (omnigent/spec/parser.py, `_parse_llm`): a provider-prefixed model,
# `connection` with `${VAR}` expansion, `request_timeout` in seconds.
#
# Anthropic, a cheap model, the key from the environment (about $0.001 per
# classified turn on Haiku 4.5):
# llm:
#   model: anthropic/claude-haiku-4-5-20251001
#   connection: {api_key: "${ANTHROPIC_API_KEY}"}
#   request_timeout: 30
#
# Ollama on the box, through its OpenAI-compatible endpoint, free and private
# (host.docker.internal reaches the host from the container; use localhost
# when the server runs on the host itself):
# llm:
#   model: openai/qwen3:30b-a3b
#   connection: {base_url: "http://host.docker.internal:11434/v1", api_key: ollama}
#   request_timeout: 30

# The scheduled agents (Phase 5, 2026-09-23) are not config either: they are
# environment, listed here because this file is where a deployment looks.
#
# OMNIGENT_BUILTIN_AGENT_DIRS registers agent specs as always-available
# built-ins at startup (omnigent/server/app.py, `_ensure_extra_builtin_agents`;
# os.pathsep-separated; the directory name is the agent name). The image
# carries the specs at /opt/ae/agents; locally they are ./agents:
#
#   OMNIGENT_BUILTIN_AGENT_DIRS=/opt/ae/agents/steward:/opt/ae/agents/shutdown:/opt/ae/agents/orchestrator
#
# The orchestrator (2026-09-25) is appended by the image's entrypoint when a
# box's line predates it; AE_EXTRA_AGENTS=off turns that off.
#
# reviewer-codex sits beside them and is off by default: append
# :/opt/ae/agents/reviewer-codex to turn it on (needs `codex login` on the host
# that runs it). A bad path is logged and skipped, never fatal, so check the
# startup log for "Registered extra built-in agent" when an agent is missing
# from the picker. Then `just schedules-seed <server-url>` creates the two
# scheduled tasks (rows, not config; scripts/seed-schedules.py).
#
# The agents' only tool is the stdio MCP server `python -m ae_omni_policies.mcp`,
# spawned by the HOST that fires the run, not by this server, with the MCP
# SDK's default environment (HOME, PATH, USER and little else). It finds this
# server as, first answer wins:
#
#   OMNIGENT_SERVER_URL   when it arrives (tests, a hand-run; not a host)
#   `server` key          in ~/.omnigent/config.yaml, written by `omnigent login`
#   the one login         in ~/.omnigent/auth_tokens.json; never picks among several
#
# and sends OMNIGENT_TOKEN when set, else the token `omnigent login` stored
# for that URL (2026-09-24).
#
# It never sees AE_TASK_STORE_URL or the AE_CF_* token: every task-store call
# goes through this server's /v1/ae routes.

# Server-wide policies, evaluated after any session and agent policies. `on:`
# is ignored for function policies (upstream parse_default_policies); each
# callable self-selects the request phase.
#
# A seed since 2026-10-18: Settings > Global Policies owns these, so they are
# switched, edited (patches 0094 and 0095) and deleted there, and changes
# survive deploys. When the container starts against a policy store holding
# none of these (matched by name or by handler), it inserts this block in one
# transaction, in this order (ae_omni_policies.policy_seed);
# otherwise it leaves the store alone. Editing this block therefore changes
# only a brand-new server, and deleting every one of them on the page brings
# the block back at the next restart. Under `policies:` they ran from the
# image and the page showed them read-only, which is why they moved.
ae_seed_policies:
  # The slot rule. A session's first prompt claims a slot while fewer than
  # the limit's top-level sessions are working; past that, `warn` holds the
  # prompt for approval in the web UI and `block` drops it with the reason.
  # "ride unparked" at the start of a message runs one more either way.
  # No `limit` here since 2026-09-24: the number is AE_SLOT_LIMIT in
  # config/server.env (three when unset), the one setting the policy,
  # GET /v1/ae/capacity and the web UI's counts all read. A `limit` set here,
  # or on the Global Policies page, would cap the policy alone and leave the
  # UI showing the other number.
  ae_slot_cap:
    type: function
    handler: ae_omni_policies.slot_cap.slot_cap
    factory_params:
      mode: warn
      # The Parking Lot page (Phase 3, 2026-09-23), named in the reason text
      # when the cap holds a prompt.
      lot_url: /extensions/analyticendeavors.parking-lot/lot
  # `triage off` / `triage capture` / `triage on`, as the ae.triage label.
  ae_hurry_modes:
    type: function
    handler: ae_omni_policies.hurry.hurry_modes
  # A second-model hint that never gates (Phase 4, 2026-09-23): the policy
  # model says whether a message starts a second deliverable and the session
  # gets ae.fork_suspect=<hash> for a chip. Needs the llm: block above; without
  # it the policy abstains. `annotate_prompt: true` also appends one line to
  # the user text ("ae: this message may start a second deliverable; if it
  # does, gate it."), off by default.
  ae_fork_suspect:
    type: function
    handler: ae_omni_policies.fork_suspect.fork_suspect
    factory_params:
      min_chars: 40
      annotate_prompt: false
  # One check-in per session past four hours since the slot was claimed or
  # sixty prompts, naming elapsed time, turns and the title; accept
  # acknowledges for the session. `hours: 0` disables it.
  ae_rabbit_hole:
    type: function
    handler: ae_omni_policies.rabbit_hole.rabbit_hole
    factory_params:
      hours: 4
      turns: 60
  # The observer's fallback for an upstream without patch P3: scans the
  # session's newest items at each prompt for the branch-discipline tokens.
  # With the patch applied (the pinned fork carries it) this abstains at no
  # cost; it is declared so a sync that loses the patch degrades instead of
  # going blind.
  ae_observer_fallback:
    type: function
    handler: ae_omni_policies.observer.observe
