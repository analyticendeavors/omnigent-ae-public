# Ruff for the repository-level Python that sits outside packages/ (tests/deploy,
# scripts/*.py). The same rule set as packages/ae_omni_policies/pyproject.toml,
# which is upstream's, so `just lint` holds every Python file here to one bar.
# Each package keeps its own [tool.ruff] (the closest config wins), so this file
# never reaches them. Added 2026-09-23 (Phase 6) with tests/deploy.
line-length = 99
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "ARG", "BLE", "B", "SIM", "RET", "C4", "PIE", "DTZ", "LOG", "RUF"]
ignore = ["ARG003", "RUF001", "RUF002", "RUF003", "SIM102", "SIM103", "SIM108"]

[lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG004", "ARG005", "BLE001", "RUF012", "B007", "B008", "SIM117", "E501"]
